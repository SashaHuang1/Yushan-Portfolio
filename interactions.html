<script>
(()=>{'use strict';
const init=()=>{
document.documentElement.classList.add('js-enhanced');
const unlock=document.getElementById('unlock-skills'),panel=document.getElementById('skill-reveal');
if(unlock&&panel){unlock.addEventListener('click',()=>{const opened=panel.classList.toggle('open');unlock.setAttribute('aria-expanded',String(opened));unlock.textContent=opened?'Skills unlocked ✨':'Hire me to unlock my skills 🔓';});}
const buttons=document.querySelectorAll('.filter-btn');buttons.forEach(btn=>btn.addEventListener('click',()=>{buttons.forEach(b=>{b.classList.toggle('active',b===btn);b.setAttribute('aria-pressed',String(b===btn));});document.querySelectorAll('.project-card[data-category]').forEach(card=>{card.hidden=!(btn.dataset.filter==='all'||card.dataset.category===btn.dataset.filter);});}));
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const items=document.querySelectorAll('.reveal-on-scroll');if('IntersectionObserver'in window&&!reduce){const obs=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}}),{threshold:.07});items.forEach(el=>obs.observe(el));}else{items.forEach(el=>el.classList.add('visible'));}
if(!reduce&&window.matchMedia('(pointer:fine)').matches){const portrait=document.querySelector('.portrait-wrap');if(portrait){portrait.addEventListener('pointermove',e=>{const r=portrait.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;portrait.style.transform=`rotate(-2deg) perspective(1000px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateY(-5px)`;});portrait.addEventListener('pointerleave',()=>portrait.style.transform='');}}
};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
